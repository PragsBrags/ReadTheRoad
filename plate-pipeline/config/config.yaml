# DISTRIBUTED LICENSE PLATE DETECTION PLATFORM — CONFIGURATION

system:
  mode: production # production | development | testing

# ---------------------------------------------------------------------------
# VIDEO INGESTION
# ---------------------------------------------------------------------------
video_ingestion:
  sources:
    - file
    - rtsp
    - rtmp
  max_streams: 20
  upload_dir: /tmp/plate-pipeline/uploads
  frame_output_dir: /tmp/plate-pipeline/frames

# DECODER (FFmpeg )
decoder:
  engine: ffmpeg # ONLY ffmpeg allowed
  ffmpeg:
    binary_path: ffmpeg
    frame_filter: "eq(pict_type,P)"
    vsync: vfr
    output_format: jpg
    output_quality: 2 # JPEG quality (2=high, 31=low)
  hardware_acceleration: false # Set true if GPU decoding available
  timeout_seconds: 300

# ---------------------------------------------------------------------------
# PREPROCESSING
# ---------------------------------------------------------------------------
preprocessing: 
  enabled: false
  min_plate_width: 100
  enhance_image_ocr: true

#Debug preprocessed frames
debug:
  save_intermediate_images: false
  output_dir: /tmp/plate-pipeline/debug
  
# ---------------------------------------------------------------------------
# FRAME SAMPLER
# ---------------------------------------------------------------------------
frame_sampler:
  strategy: hybrid # fixed_fps | motion | hybrid | nyquist
  fixed_fps: 2
  motion_threshold: 0.2 # SSIM threshold for motion detection
  nyquist_event_frequency: 1.0 # Expected events per second
  downscale_factor: 1.0 # 1.0 = no downscale, 0.5 = half resolution
  motion_area_threshold: 100
  cooldown_frames: 10
  warmup_frames: 100

# ---------------------------------------------------------------------------
# INFERENCE CONFIGURATION
# ---------------------------------------------------------------------------
inference:
  mode: yolo_ocr # Active mode: yolo_only | ocr_only | yolo_ocr | yolo_ocr_llm | direct_llm

  modes:
    yolo_only:
      enabled: true
      description: "Detect license plate bounding boxes only"

    ocr_only:
      enabled: true
      description: "OCR on pre-cropped plate images"

    yolo_ocr:
      enabled: true
      description: "Detect plate → crop → OCR (default)"

    yolo_ocr_llm:
      enabled: false
      description: "YOLO+OCR with LLM correction for ambiguous chars"

    direct_llm:
      enabled: false
      description: "Direct LLM vision inference on cropped plates"

# ---------------------------------------------------------------------------
# MODEL REGISTRY
# ---------------------------------------------------------------------------
model_registry:
  yolo:
    path: /models/plate.pt
    confidence_threshold: 0.1
    iou_threshold: 0.1
    device: mps # cpu | cuda | mps
    imgsz: 640
    selection_policy: all # all | best

# ---------------------------------------------------------------------------
# OCR CONFIGURATION
# ---------------------------------------------------------------------------
ocr:
  engine: easyocr # easyocr | paddleocr
  enabled: true
  easyocr:
    languages:
      - en
    gpu: false
    detail: 1
  paddleocr:
    lang: en
    use_angle_cls: true
    use_gpu: false

# ---------------------------------------------------------------------------
# LLM CONFIGURATION
# ---------------------------------------------------------------------------
llm:
  enabled: false
  provider: openai # openai | anthropic | ollama
  mode: gated # gated | always | disabled
  max_calls_per_job: 1
  fallback_to_ocr: true
  timeout_seconds: 30

  openai:
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    max_tokens: 100
    temperature: 0.1

  anthropic:
    model: claude-3-haiku-20240307
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 100

  ollama:
    model: llava
    base_url: http://localhost:11434

  circuit_breaker:
    failure_threshold: 5 # Consecutive failures before tripping
    recovery_timeout_seconds: 60
    half_open_max_calls: 2

# ---------------------------------------------------------------------------
# DSPy CONFIGURATION
# ---------------------------------------------------------------------------
dspy:
  enabled: true
  prompt_compression: true
  optimizer: bootstrap_fewshot # bootstrap_fewshot | miprov2
  max_bootstrapped_demos: 4
  max_labeled_demos: 16
  lm_model: openai/gpt-4o-mini

# ---------------------------------------------------------------------------
# QUEUE (RabbitMQ)
# ---------------------------------------------------------------------------
queue:
  broker: rabbitmq
  broker_url: amqp://guest:guest@rabbitmq:5672//
  prefetch_count: 10
  frame_queue: plate_frames
  result_queue: plate_results
  max_retries: 3
  retry_delay_seconds: 5

# ---------------------------------------------------------------------------
# WORKERS (Celery)
# ---------------------------------------------------------------------------
workers:
  celery:
    broker_url: amqp://guest:guest@rabbitmq:5672//
    result_backend: redis://redis:6379/0
    concurrency: 2
    task_serializer: json
    result_serializer: json
    accept_content:
      - json
    task_acks_late: true
    worker_prefetch_multiplier: 1
    autoscale:
      min: 2
      max: 16

# ---------------------------------------------------------------------------
# REDIS
# ---------------------------------------------------------------------------
redis:
  enabled: true
  url: redis://redis:6379/0
  ttl_seconds: 300
  deduplication: true
  dedup_ttl_seconds: 60
  key_prefix: plate_pipeline

# ---------------------------------------------------------------------------
# DATABSASE — LOCALHOST
# ---------------------------------------------------------------------------
database:
  enabled: true
  url: postgresql+psycopg://plate_user:plate_pass@localhost:5432/plate_pipeline
  echo: false
  create_tables: true
  pool_size: 5
  max_overflow: 10

# ---------------------------------------------------------------------------
# AGGREGATION
# ---------------------------------------------------------------------------
aggregation:
  window_ms: 3000
  dedup_threshold: 0.85 # String similarity threshold
  min_confidence: 0.4
  max_results_per_window: 50

# ---------------------------------------------------------------------------
# MONITORING
# ---------------------------------------------------------------------------
monitoring:
  prometheus:
    enabled: true
    port: 8000
    path: /metrics
  grafana:
    enabled: true
    port: 3000
