# LOCAL DEVELOPMENT CONFIG — localhost URLs
#
# Use this config when running WITHOUT Docker:
#   export PLATE_PIPELINE_CONFIG=config/config.local.yaml
#   python main.py
#
# Key differences from config.yaml (Docker):
#   - RabbitMQ/Redis URLs point to localhost instead of container names
#   - System mode is 'development'
#   - YOLO model path uses local ./models/ directory

system:
  mode: development

# ---------------------------------------------------------------------------
# VIDEO INGESTION
# ---------------------------------------------------------------------------
video_ingestion:
  sources:
    - file
    - rtsp
    - rtmp
  max_streams: 20
  upload_dir: /tmp/plate-pipeline/uploads
  frame_output_dir: /tmp/plate-pipeline/frames

# ---------------------------------------------------------------------------
# PREPROCESSING
# ---------------------------------------------------------------------------
preprocessing: 
  enabled: false
  min_plate_width: 100
  enhance_image_ocr: true

#Debug preprocessed frames
debug:
  save_intermediate_images: false
  output_dir: /tmp/plate-pipeline/debug

# ---------------------------------------------------------------------------
# DECODER (FFmpeg — MANDATORY)
# ---------------------------------------------------------------------------
decoder:
  engine: ffmpeg
  ffmpeg:
    binary_path: ffmpeg
    frame_filter: "eq(pict_type,P)"
    vsync: vfr
    output_format: jpg
    output_quality: 2
  hardware_acceleration: false
  timeout_seconds: 300

# ---------------------------------------------------------------------------
# FRAME SAMPLER
# ---------------------------------------------------------------------------
frame_sampler:
  strategy: motion_sharpness # fixed_fps | motion | hybrid | nyquist | motion_sharpness
  fixed_fps: 2
  motion_threshold: 0.2
  nyquist_event_frequency: 1.0
  downscale_factor: 0.5
  motion_area_threshold: 100
  cooldown_frames: 10
  warmup_frames: 100

# ---------------------------------------------------------------------------
# INFERENCE CONFIGURATION
# ---------------------------------------------------------------------------
inference:
  mode: yolo_ocr

  modes:
    yolo_only:
      enabled: true
      description: "Detect license plate bounding boxes only"
    ocr_only:
      enabled: true
      description: "OCR on pre-cropped plate images"
    yolo_ocr:
      enabled: true
      description: "Detect plate → crop → OCR (default)"
    yolo_ocr_llm:
      enabled: false
      description: "YOLO+OCR with LLM correction"
    direct_llm:
      enabled: false
      description: "Direct LLM vision inference"

# ---------------------------------------------------------------------------
# MODEL REGISTRY — LOCAL PATHS
# ---------------------------------------------------------------------------
model_registry:
  yolo:
    path: ./models/plate.pt # Local path — put your .pt here
    confidence_threshold: 0.1
    iou_threshold: 0.1
    device: cpu # cpu | cuda | mps
    imgsz: 640
    selection_policy: all # all | best

# ---------------------------------------------------------------------------
# OCR CONFIGURATION
# ---------------------------------------------------------------------------
ocr:
  engine: easyocr
  enabled: true
  easyocr:
    languages:
      - en
    gpu: false
    detail: 1
  paddleocr:
    lang: en
    use_angle_cls: true
    use_gpu: false

# ---------------------------------------------------------------------------
# LLM CONFIGURATION
# ---------------------------------------------------------------------------
llm:
  enabled: false
  provider: openai
  mode: gated
  max_calls_per_job: 1
  fallback_to_ocr: true
  timeout_seconds: 30
  openai:
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    max_tokens: 100
    temperature: 0.1
  ollama:
    model: llava
    base_url: http://localhost:11434
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout_seconds: 60
    half_open_max_calls: 2

# ---------------------------------------------------------------------------
# DSPy
# ---------------------------------------------------------------------------
dspy:
  enabled: false
  prompt_compression: true
  optimizer: bootstrap_fewshot
  max_bootstrapped_demos: 4
  max_labeled_demos: 16
  lm_model: openai/gpt-4o-mini

# ---------------------------------------------------------------------------
# QUEUE (RabbitMQ) — LOCALHOST
# ---------------------------------------------------------------------------
queue:
  broker: rabbitmq
  broker_url: amqp://guest:guest@localhost:5672//
  prefetch_count: 10
  frame_queue: plate_frames
  result_queue: plate_results
  max_retries: 3
  retry_delay_seconds: 5

# ---------------------------------------------------------------------------
# WORKERS (Celery) — LOCALHOST
# ---------------------------------------------------------------------------
workers:
  celery:
    broker_url: amqp://guest:guest@localhost:5672//
    result_backend: redis://localhost:6379/0
    concurrency: 2
    task_serializer: json
    result_serializer: json
    accept_content:
      - json
    task_acks_late: true
    worker_prefetch_multiplier: 1
    autoscale:
      min: 2
      max: 16

# ---------------------------------------------------------------------------
# REDIS — LOCALHOST
# ---------------------------------------------------------------------------
redis:
  enabled: true
  url: redis://localhost:6379/0
  ttl_seconds: 300
  deduplication: true
  dedup_ttl_seconds: 60
  key_prefix: plate_pipeline

# ---------------------------------------------------------------------------
# DATABSASE — LOCALHOST
# ---------------------------------------------------------------------------
database:
  enabled: true
  url: postgresql+psycopg://plate_user:plate_pass@localhost:5432/plate_pipeline
  echo: false
  create_tables: true
  pool_size: 5
  max_overflow: 10

# ---------------------------------------------------------------------------
# AGGREGATION
# ---------------------------------------------------------------------------
aggregation:
  window_ms: 3000
  dedup_threshold: 0.85
  min_confidence: 0.4
  max_results_per_window: 50

# ---------------------------------------------------------------------------
# MONITORING
# ---------------------------------------------------------------------------
monitoring:
  prometheus:
    enabled: true
    port: 8000
    path: /metrics
  grafana:
    enabled: true
    port: 3000
