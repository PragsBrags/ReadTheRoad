# Docker Compose — Full Stack Orchestration
#
# Services:
#   - ingestion-api    : FastAPI ingestion + API
#   - celery-worker    : Celery inference workers (scalable)
#   - rabbitmq         : Message broker
#   - redis            : Cache + state + result backend
#   - prometheus       : Metrics collection
#   - grafana          : Metrics visualization
#
# Usage:
#   docker-compose up --build
#   docker-compose up --scale celery-worker=5

services:
  # INGESTION API
  ingestion-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: plate-api
    ports:
      - "8000:8000"
    volumes:
      - ../config:/app/config:ro
      - models:/models
      - uploads:/tmp/plate-pipeline/uploads
      - frames:/tmp/plate-pipeline/frames
    environment:
      - PLATE_PIPELINE_CONFIG=/app/config/config.yaml
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PADDLE_HOME=/tmp/ocr-models/paddle
      - PADDLEX_HOME=/tmp/ocr-models/paddlex
      - EASYOCR_MODULE_PATH=/tmp/ocr-models/easyocr
      - TORCH_HOME=/tmp/ocr-models/torch
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - MPLCONFIGDIR=/tmp/matplotlib
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - FONTCONFIG_CACHE=/tmp/fontconfig
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - plate-net
    restart: unless-stopped

  # CELERY WORKER (scalable)
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    volumes:
      - ../config:/app/config:ro
      - models:/models
      - frames:/tmp/plate-pipeline/frames
    environment:
      - PLATE_PIPELINE_CONFIG=/app/config/config.yaml
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PADDLE_HOME=/tmp/ocr-models/paddle
      - PADDLEX_HOME=/tmp/ocr-models/paddlex
      - EASYOCR_MODULE_PATH=/tmp/ocr-models/easyocr
      - TORCH_HOME=/tmp/ocr-models/torch
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - MPLCONFIGDIR=/tmp/matplotlib
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - FONTCONFIG_CACHE=/tmp/fontconfig
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - plate-net
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 4G

  # POSTGRESQL
  postgres:
    image: postgres:15-alpine
    container_name: plate-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: god123great
      POSTGRES_DB: plate_pipeline
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - plate-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plate_pipeline"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RABBITMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: plate-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - plate-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # REDIS
  redis:
    image: redis:7-alpine
    container_name: plate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - plate-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PROMETHEUS
  prometheus:
    image: prom/prometheus:latest
    container_name: plate-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - plate-net
    restart: unless-stopped

  # GRAFANA
  grafana:
    image: grafana/grafana:latest
    container_name: plate-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - plate-net
    restart: unless-stopped
    depends_on:
      - prometheus

# VOLUMES
volumes:
  models:
  uploads:
  frames:
  rabbitmq-data:
  redis-data:
  prometheus-data:
  grafana-data:
  postgres-data:

# NETWORKS
networks:
  plate-net:
    driver: bridge
