# ==============================================================================
# Prometheus Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "plate-pipeline-api"
    static_configs:
      - targets: ["ingestion-api:8000", "host.docker.internal:8000"]
    metrics_path: /metrics
    scrape_interval: 10s
